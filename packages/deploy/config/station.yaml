# Robot station config, read by every node in packages/deploy (deploy/config.py).
# Paths are relative to packages/deploy/. Override the whole file with IMITATE_DEPLOY_CONFIG=/path.yaml

hand:
  config_dir: config/orca/right     # orca_core config.yaml; calibration.yaml is written next to it
  state_hz: 100
  max_step_deg: null                # largest change per command, per joint (deg); null = commands go straight
                                    # to the motors, as in rwr_system (current-based position mode limits force)

arm:
  # every policy arm target is clipped to this box (m, in ARM_FRAME) and stepped from the last target
  workspace: {x: [0.25, 0.75], y: [-0.40, 0.40], z: [0.05, 0.60]}
  max_step_m: 0.01                  # per policy tick
  max_step_deg: 3.0                 # per policy tick
  home: null                        # [x, y, z, qx, qy, qz, qw]: set to a pose checked at this station
                                    # (rwr_system's right-arm start: [0.45, 0.0, 0.2, 1, 0, 0, 0], gripper down)
  stale_s: 0.2                      # policy stops if the arm pose is older than this
  max_lead_m: 0.02                  # live: a command is never further than this from the measured pose

camera:
  width: 848
  height: 480
  fps: 30

oak:                                # second camera (Luxonis OAK, deploy/nodes/oak_node.py)
  width: 960                        # colour: 1080p sensor scaled by 1/2 on the device (full FOV);
  height: 540                       # depth (640x400 stereo) is aligned to it at this size
  fps: 30
  ir_projector_ma: 0                # IR dot projector (OAK Pro only), 0 = off; ~800 helps on plain surfaces

policy:
  hz: 10
  plugin: deploy.policies.demo:DemoPolicy   # module:Class implementing deploy.policies.base.Policy
  checkpoint: null
  uses_arm: true
  stale_s: 0.2                      # policy stops if the hand state is older than this

manual:
  # dashboard manual control (policy_node status "manual"): slower than policy limits on purpose
  hand_max_step_deg: null           # per policy tick (deg); null = sliders go straight to the hand, no delay
  arm_max_step_m: 0.002             # per policy tick (10 Hz -> 2 cm/s)
  arm_max_step_deg: 1.0             # per policy tick; manual keeps the orientation it started with
  max_jog_m: 0.05                   # largest single jog the dashboard may send

mock:
  video: null                       # e.g. ../../output/rubiks_nov24/rubiks_nov24_rgb.mp4; null = test pattern
  arm_start: [0.45, 0.0, 0.35, 1.0, 0.0, 0.0, 0.0]   # gripper pointing down
  hand_tau_s: 0.08                  # first-order lag of the simulated hand
  arm_tau_s: 0.15

station:
  host: 127.0.0.1                   # 0.0.0.0 to open the dashboard from another machine (no login!)
  port: 8000
  stream_hz: 30
  camera_hz: 15
  jpeg_quality: 70
  history_s: 60
  # expected rate per topic for the health lights; missing topics show as missing
  expected_hz:
    /right/hand/joint_states: 100
    /right/arm/end_effector_pose: 30   # multipanda_ros2 publishes ~30 Hz (measured with spike-ping arm)
    /camera/color/image_raw: 30
    /camera/depth/image_raw: 30
    /oak/color/image_raw: 30
    /oak/depth/image_raw: 30
    /policy/metrics: 10
