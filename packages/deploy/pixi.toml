# Robot-side environment (ROS 2 Jazzy from RoboStack), separate from the repo's uv env.
# Same lockfile for the Ubuntu dev box and the Apple Silicon Mac at the robot.
#
#   cd packages/deploy
#   pixi run test            # unit tests
#   pixi run station         # dashboard only, start the simulated nodes from its Processes card
#   pixi run mock            # whole station with simulated hand, arm and camera -> http://127.0.0.1:8000
#   pixi run -e hw real      # ORCA hand + RealSense (the Franka controller runs on its own machine)
#   pixi run -e hw station-real  # dashboard only, start the real hand/camera/policy from its Processes card
#   (the dashboard is a static page in packages/dashboard/web, served by the station: no build step)

[workspace]
name = "imitate-deploy"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[activation]
scripts = ["config/station_env.sh"]   # sets ROBOT_NET_IP for config/fastdds.xml

[activation.env]
# large camera frames need a bigger shared-memory segment than Fast DDS's default (see the file)
FASTRTPS_DEFAULT_PROFILES_FILE = "$PIXI_PROJECT_ROOT/config/fastdds.xml"
FASTDDS_DEFAULT_PROFILES_FILE = "$PIXI_PROJECT_ROOT/config/fastdds.xml"

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"        # rclpy, launch, ros2 CLI, common_interfaces, rosbag2
numpy = "*"
pyyaml = "*"
opencv = "*"
fastapi = "*"
uvicorn = ">=0.34.2,<0.35"   # orca_core 0.5.2 (hw) requires this range; default and hw share a solve group
websockets = "*"
pytest = "*"

[pypi-dependencies]
imitate-common = { path = "../common", editable = true }
imitate-deploy = { path = ".", editable = true }

# --- hardware drivers: only on the robot machine -------------------------------------------
[feature.hw.dependencies]
pyserial = "*"

[feature.hw.pypi-dependencies]
# rwr_system installed this with --no-deps because it declared a newer numpy than rwr pinned.
# Here numpy is not pinned; if the solve still conflicts, see spike/README.md.
orca_core = "==0.5.2"
depthai = "==2.32.0.0"   # Luxonis OAK camera (deploy/nodes/oak_node.py); 2.x API, as rwr_system used

[feature.hw.target.linux-64.pypi-dependencies]
pyrealsense2 = "*"

[feature.hw.target.osx-arm64.pypi-dependencies]
# Intel ships no macOS wheels; this is the community build. Verify in spike/realsense_check.py.
pyrealsense2-macosx = "*"

[environments]
default = { solve-group = "main" }
hw = { features = ["hw"], solve-group = "main" }

[tasks]
# ROS domains: the Franka controller (multipanda_ros2 on the NUC) uses 7; simulation uses 0 so a mock
# station can never talk to the real arm (the launch file also refuses profile:=mock on domain 7).
test = "pytest -q tests ../common/tests"
mock = { cmd = "ros2 launch launch/robot.launch.py profile:=mock", env = { ROS_DOMAIN_ID = "0" } }
real = { cmd = "ros2 launch launch/robot.launch.py profile:=real", env = { ROS_DOMAIN_ID = "7" } }
# real arm + RealSense with a simulated hand (before the ORCA hand is connected);
# append camera:=mock to also simulate the camera, e.g. `pixi run -e hw real-arm camera:=mock`
real-arm = { cmd = "ros2 launch launch/robot.launch.py profile:=real hand:=mock", env = { ROS_DOMAIN_ID = "7" } }
# dashboard alone; it starts and stops the mock nodes itself (Processes card), so domain 0
station = { cmd = "python -m deploy.station.server", env = { ROS_DOMAIN_ID = "0" } }
spike-env = "python spike/check_env.py"
spike-ping = { cmd = "python spike/ros_ping.py", env = { ROS_DOMAIN_ID = "7" } }
spike-realsense = "python spike/realsense_check.py"
spike-orca = "python spike/orca_check.py"

# dashboard alone, real profile: start/stop the real hand, RealSense and policy node from its Processes card
# (domain 7; the Franka controller still runs on the NUC). Only in the hw env, which has the drivers.
[feature.hw.tasks]
station-real = { cmd = "python -m deploy.station.server", env = { ROS_DOMAIN_ID = "7", IMITATE_STATION_PROFILE = "real" } }
station-real-arm = { cmd = "python -m deploy.station.server", env = { ROS_DOMAIN_ID = "7", IMITATE_STATION_PROFILE = "real", IMITATE_STATION_HAND = "mock" } }
